[build-system]
build-backend = 'uv_build'
requires = ['uv_build>=0.11,<0.12']

[project]
name = 'portalocker'
version = '4.0.0'
dynamic = []
description = 'Wraps the portalocker recipe for easy usage'
readme = 'README.rst'
requires-python = '>=3.10'
license = 'BSD-3-Clause'
license-files = ['LICENSE']
authors = [{ name = 'Rick van Hattem', email = 'wolph@wol.ph' }]
keywords = ['locking', 'locks', 'with', 'statement', 'windows', 'linux', 'unix']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Typing :: Typed',
]
dependencies = []

[project.urls]
homepage = 'https://github.com/wolph/portalocker/'
documentation = 'https://portalocker.readthedocs.io/en/latest/'
repository = 'https://github.com/wolph/portalocker/'

[project.optional-dependencies]
redis = ['redis']
win32 = ["pywin32>=226; platform_system == 'Windows'"]
tests = [
    'portalocker[redis]',
    'fakeredis>=2.31.0',
    'pytest>=5.4.1',
    'pytest-cov>=2.8.1',
    'pytest-timeout>=2.1.0',
    'pytest-rerunfailures>=15.1',
    'types-pywin32>=310.0.0.20250429',
]
docs = [
    'sphinx>=7',
    'furo',
]

[dependency-groups]
dev = [
    'portalocker[tests,docs]',
    'ruff',
    'mypy',
    'basedpyright',
    'pyrefly',
    'ty',
    'codespell',
    'tox>=4.21',
    'tox-uv',
]

[tool.uv.build-backend]
module-name = 'portalocker'
module-root = ''

[tool.codespell]
skip = '*.css,*.js,*.lock,./docs/_build,./htmlcov,./.git,./.tox,./.venv'

[tool.repo-review]
ignore = [
    'PY004', # no /docs with markdown - we use RST
    'PY005', # tests folder is portalocker_tests (public import path for downstream)
    'PC110', # no black, we use ruff
    'PC111', # no blacken-docs, we use ruff
    'PC140', # manual mypy instead of pre-commit
    'PC160', # manual codespell instead of pre-commit
    'PC170', # no pygrep
    'PC180', # no css/js to format
    'PC190', # manual ruff instead of pre-commit
    'PC901', # no pre-commit CI; lefthook is used instead
    'MY103', # mypy strict = true is set in [tool.mypy]
]

[tool.pytest.ini_options]
minversion = '6.0'
addopts = [
    '--doctest-modules',
    '--cov=portalocker',
    '--cov-report=term-missing',
    '--cov-fail-under=100',
    '--timeout=20',
    '-p', 'no:cacheprovider',
]
testpaths = ['portalocker', 'portalocker_tests']
filterwarnings = [
    'error',
    'ignore::DeprecationWarning',
    'ignore::PendingDeprecationWarning',
    'ignore::ImportWarning',
    'ignore::ResourceWarning',
]

[tool.coverage.run]
branch = true
relative_files = true
source = ['portalocker', 'portalocker_tests']

[tool.coverage.report]
fail_under = 100
ignore_errors = true
exclude_also = [
    'pragma: no cover',
    'pragma: not-nt', # posix-only implementation excluded on this OS job
    'pragma: not-posix', # nt-only implementation excluded on this OS job
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'if typing.TYPE_CHECKING:',
    'if TYPE_CHECKING:',
    '@(typing\.)?overload',
    'raise AssertionError',
    'raise NotImplementedError',
    'except ImportError:',
    'if 0:',
    'if __name__ == .__main__.:', # CLI entry-point guard, not exercised by imports
    'typing.Protocol',
    'if os\.name', # platform-specific branches combine across OS jobs
    'if sys\.platform',
]

[tool.mypy]
python_version = '3.10'
strict = true
warn_unreachable = true
enable_error_code = ['ignore-without-code', 'truthy-bool', 'redundant-expr']
packages = ['portalocker', 'portalocker_tests']

[[tool.mypy.overrides]]
module = 'portalocker_tests.*'
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = '3.10'
typeCheckingMode = 'standard'
strict = ['portalocker']
include = ['portalocker', 'portalocker_tests']
exclude = ['.venv', '.tox', 'build', 'dist', 'docs']

[tool.pyrefly]
project-includes = ['portalocker', 'portalocker_tests']
project-excludes = ['.venv', '.tox', 'build', 'dist']
python-version = '3.10'

[tool.ty.environment]
python-version = '3.10'

[tool.ty.src]
include = ['portalocker', 'portalocker_tests']

