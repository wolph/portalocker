# Ruff rewrites quote styles and capitalises docstrings without any help
# from a person, so a contributor should never have to. This hands those
# fixes to the autofix.ci app, which commits them to the pull request
# branch, forks included. The gate lives in ci.yml and stays untouched:
# whatever ruff cannot fix still fails there.
#
# Pull requests only. The gate in ci.yml already checks every push to
# develop and master, so a push run here would buy nothing except an
# automated write to a release branch by the output of a tool resolved
# at run time (security audit run-2, finding 1). The ruff the fixer runs
# is pinned in tox.toml for the same reason.
#
# The filename and the workflow name are both fixed by autofix.ci, which
# uses them to identify the workflow it trusts. Renaming either one stops
# the app from accepting the patch.
name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - run: uv run tox -e ruff-fix
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
