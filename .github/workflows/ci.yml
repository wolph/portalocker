name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: [mypy, basedpyright, pyrefly, ty, codespell, repo-review, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - run: uv run tox -e ${{ matrix.env }}

  # A quote style ruff can rewrite on its own is not worth a red cross on
  # someone's first pull request, so pull requests get the fixes applied
  # before the gate runs and only report what is left, which is always a
  # question a person has to answer. autofix.yml pushes those same fixes
  # to the branch. Pushes to develop and master check the tree as it is,
  # so non-conforming code cannot land even with the app uninstalled.
  ruff:
    name: checks (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - if: github.event_name == 'pull_request'
        run: uv run tox -e ruff-fix
      - run: uv run tox -e ruff
        env:
          RUFF_OUTPUT_FORMAT: >-
            ${{ github.event_name == 'pull_request' && 'github' || 'full' }}

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          annotations: true

  distribution:
    name: Distribution checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv run tox -e distribution

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            python-version: pypy3.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start redis
        if: runner.os == 'Linux' && !startsWith(matrix.python-version, 'pypy')
        uses: shogo82148/actions-setup-redis@88a1fb308aae95aa485bf3da667c9d6e61be4c53 # v1.58.0
        with:
          redis-version: '7.x'
      - name: Run tests
        run: uv run --no-default-groups --extra tests pytest -v
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}
      - name: Require live Redis tests
        if: runner.os == 'Linux' && !startsWith(matrix.python-version, 'pypy')
        run: uv run tox -e redis-live
      - name: Store coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-windows-pywin32:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - name: Run tests with pywin32 installed
        run: uv run --no-default-groups --extra tests --extra win32 pytest -v
        env:
          COVERAGE_FILE: .coverage.windows-latest-pywin32
      - name: Store coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-windows-latest-pywin32
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Every matrix cell already enforces 100% on its own platform. This job
  # merges their data files so Coveralls reports a single number for the
  # whole matrix instead of whichever cell uploaded last, and so the badge
  # measures a build rather than repeating a hardcoded claim.
  coverage:
    name: Coverage
    needs: [test, test-windows-pywin32]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - name: Collect coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage data
        run: uv run --no-default-groups --extra tests coverage combine
      # `fail_under = 100` lives in pyproject.toml, so this step is the gate
      # on the merged result and not only a report.
      - name: Report combined coverage
        run: uv run --no-default-groups --extra tests coverage report --show-missing
      - name: Convert coverage data to lcov
        run: uv run --no-default-groups --extra tests coverage lcov -o coverage.lcov
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          format: lcov

  # Dependabot opens against the default branch whenever target-branch is
  # absent, and its security updates ignore target-branch entirely and always
  # use the default branch. Either route lands a commit on master, which
  # re-diverges it from develop and turns the next release merge into a
  # conflict resolution. Both invariants are one line of config each and
  # neither announces itself when it changes, so assert them here.
  repo-config:
    name: Repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Dependabot and the default branch both point at develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          export DEFAULT_BRANCH="$default_branch"
          uv run --no-project --with pyyaml python - <<'PY'
          import os
          import pathlib
          import sys

          import yaml

          WANTED = 'develop'
          problems: list[str] = []

          default_branch: str = os.environ['DEFAULT_BRANCH']
          if default_branch != WANTED:
              problems.append(
                  f'the default branch is {default_branch!r}, not {WANTED!r}. '
                  f'Dependabot security updates always open against the '
                  f'default branch and cannot be redirected.'
              )

          # The config file is optional: without it Dependabot still runs
          # security updates, and those follow the default branch checked
          # above. Once it exists, every entry has to name develop, because an
          # entry without target-branch falls back to the default branch of
          # the day rather than to develop by name.
          config_path: pathlib.Path = pathlib.Path('.github/dependabot.yml')
          updates: list[dict[str, object]] = []
          if config_path.exists():
              config: dict[str, object] = yaml.safe_load(
                  config_path.read_text()
              )
              updates = config.get('updates') or []
              if not updates:
                  problems.append('.github/dependabot.yml declares no updates')

              for entry in updates:
                  ecosystem: object = entry.get('package-ecosystem', '<unnamed>')
                  directory: object = entry.get('directory', '<unset>')
                  target: object = entry.get('target-branch')
                  if target != WANTED:
                      problems.append(
                          f'{ecosystem} in {directory} targets {target!r}, '
                          f'not {WANTED!r}'
                      )

          if problems:
              for problem in problems:
                  print(f'error: {problem}', file=sys.stderr)
              sys.exit(1)

          print(
              f'The default branch and {len(updates)} Dependabot update(s) '
              f'all point at {WANTED!r}.'
          )
          PY
