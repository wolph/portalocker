name: Test sync-master job
# Temporary: manually exercises the sync-master job from publish.yml against
# an existing tag, so the job can be verified without publishing to PyPI.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to fast-forward master to
        required: true
        type: string

jobs:
  sync-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_MASTER_TOKEN }}
      - name: Fast-forward master to the release tag
        run: git push origin HEAD:master
