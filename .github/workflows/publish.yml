name: Publish to PyPI and GitHub releases

on:
  push:
    tags:
      - 'v*'

jobs:
  # Fail the release before anything reaches PyPI. Everything checked
  # here used to fail only in the jobs that run after publishing, which
  # leaves a half-finished release: the package on PyPI with no GitHub
  # release, or master stale. A red preflight instead stops the whole
  # run while re-tagging is still cheap.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tag matches pyproject.toml and CHANGELOG.rst
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n "s/^version = '\(.*\)'$/\1/p" pyproject.toml)"
          if [ "$version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml" \
              "version $project_version" >&2
            exit 1
          fi
          if ! grep -q "^${version}:\$" CHANGELOG.rst; then
            echo "No CHANGELOG.rst section found for $version" >&2
            exit 1
          fi
      - name: Verify master can fast-forward to this tag
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "master has diverged from this tag; sync-master would" \
              "fail after publishing. Reconcile master first." >&2
            exit 1
          fi
      # An expired or rotated PAT used to surface only in sync-master,
      # after the package was already on PyPI.
      - name: Verify the SYNC_MASTER_TOKEN can push
        env:
          GH_TOKEN: ${{ secrets.SYNC_MASTER_TOKEN }}
        run: |
          push="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push')"
          if [ "$push" != 'true' ]; then
            echo "SYNC_MASTER_TOKEN is missing, expired or cannot push" >&2
            exit 1
          fi

  # Tag pushes do not trigger ci.yml on their own; run the full suite
  # here so nothing reaches PyPI without passing tests.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [preflight, test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # skip-existing makes a tag re-push idempotent: without it a
      # re-run dies on the PyPI duplicate-file error before the release
      # and sync-master jobs get a second chance.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # GitHub releases used to be a manual step and were silently skipped when
  # forgotten; create one here so a tag push publishes everywhere at once.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == ver ":" { found = 1 }
            found && $0 != ver ":" && /^[0-9][0-9.]*:$/ { exit }
            found { print }
          ' CHANGELOG.rst | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' > notes.txt
          if ! [ -s notes.txt ]; then
            echo "No CHANGELOG.rst section found for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          --notes-file notes.txt --verify-tag

  # Keep master pointing at the latest release. Like the GitHub release, this
  # used to be a manual step and was silently skipped (master stayed at 4.1.0
  # while 4.2.0 shipped). A plain push refuses non-fast-forward updates, so a
  # diverged master fails this job loudly instead of being overwritten.
  #
  # Uses the SYNC_MASTER_TOKEN fine-grained PAT (Contents + Workflows write)
  # because GITHUB_TOKEN is forbidden from pushing commits that touch
  # .github/workflows/, which any release including workflow changes does.
  sync-master:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_MASTER_TOKEN }}
      # master tracks stable releases only. A pre-release tag (v4.4.0rc1)
      # may publish to PyPI, but fast-forwarding master past the latest
      # stable release would present the rc as the current state.
      - name: Fast-forward master to the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *[!0-9.]*)
              echo "Pre-release tag $GITHUB_REF_NAME, leaving master alone"
              exit 0
              ;;
          esac
          git push origin HEAD:master
